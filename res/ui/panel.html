<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>汽水音乐 · 自动领取</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  html, body { height: 100%; background: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif;
    color: #eef1f8;
    padding: 0;
    margin: 0;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  .card {
    height: 100%;
    background: #171b26;
    border-radius: 22px;
    border: 1px solid #262c3c;
    padding: 18px 18px 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 顶部 */
  .head { display: flex; align-items: flex-start; }
  .head-main { flex: 1; }
  .title {
    font-size: 17px; font-weight: 600; letter-spacing: .3px;
    display: flex; align-items: center; gap: 8px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #3ddc84;
    box-shadow: 0 0 9px rgba(61, 220, 132, .9);
    flex: none;
  }
  .sub { font-size: 11.5px; color: #7b8499; margin-top: 6px; letter-spacing: .2px; }
  .close {
    width: 30px; height: 30px; border-radius: 50%;
    border: none; background: #242938; color: #8b93a7;
    font-size: 15px; line-height: 1; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .close:active { background: #2e3446; }

  /* 天数选择器 */
  .picker {
    margin-top: 20px;
    background: #1e2331;
    border: 1px solid #2b3143;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
  }
  .step {
    width: 54px; height: 54px; border-radius: 14px;
    border: none; background: #2a3040; color: #d6dcea;
    font-size: 26px; font-weight: 300; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background .12s, transform .12s;
  }
  .step:active { background: #363d51; transform: scale(.94); }
  .step.off { opacity: .32; }

  .num-wrap { text-align: center; flex: 1; }
  .num {
    font-size: 42px; font-weight: 700; line-height: 1.05;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
  }
  .num-unit { font-size: 13px; color: #7b8499; margin-top: 3px; }

  /* 快捷值 */
  .chips { display: flex; gap: 8px; margin-top: 12px; }
  .chip {
    flex: 1; height: 38px; border-radius: 11px;
    border: 1px solid #2b3143; background: transparent;
    color: #9aa3b8; font-size: 14px; font-weight: 500;
    transition: all .12s;
  }
  .chip:active { background: #262c3c; }
  .chip.on {
    background: rgba(61, 220, 132, .14);
    border-color: #3ddc84;
    color: #3ddc84;
  }

  .spacer { flex: 1; min-height: 10px; }

  /* 提示 */
  .hint {
    font-size: 11.5px; color: #6f7789; line-height: 1.65;
    margin-bottom: 12px;
  }
  .hint b { color: #9aa3b8; font-weight: 500; }

  /* 主按钮 */
  .go {
    width: 100%; height: 56px; border: none; border-radius: 15px;
    background: linear-gradient(135deg, #3ddc84, #22b866);
    color: #0a2417; font-size: 17px; font-weight: 700; letter-spacing: .5px;
    box-shadow: 0 6px 18px rgba(45, 200, 115, .26);
    transition: transform .12s, box-shadow .12s;
  }
  .go:active { transform: scale(.975); box-shadow: 0 3px 10px rgba(45, 200, 115, .2); }
  .go.busy {
    background: #2a3040; color: #8b93a7; box-shadow: none;
  }

  .foot {
    text-align: center; font-size: 10.5px; color: #5d6577;
    margin-top: 10px; letter-spacing: .3px;
  }
</style>
</head>
<body>
<div class="card">

  <div class="head">
    <div class="head-main">
      <div class="title"><span class="dot"></span>汽水音乐 · 自动领取</div>
      <div class="sub">设置本次要连续领取的天数</div>
    </div>
    <button class="close" onclick="cancel()">✕</button>
  </div>

  <div class="picker">
    <button class="step" id="minus" onclick="step(-1)">−</button>
    <div class="num-wrap">
      <div class="num" id="num">10</div>
      <div class="num-unit">天</div>
    </div>
    <button class="step" id="plus" onclick="step(1)">＋</button>
  </div>

  <div class="chips" id="chips">
    <button class="chip" data-v="3">3</button>
    <button class="chip" data-v="5">5</button>
    <button class="chip" data-v="10">10</button>
    <button class="chip" data-v="15">15</button>
    <button class="chip" data-v="20">20</button>
  </div>

  <div class="spacer"></div>

  <div class="hint">
    每个广告约 <b>35 秒</b>，10 天约需 <b>6 分钟</b><br>
    今日额度用完会自动停止，可随时按悬浮球中断
  </div>

  <button class="go" id="go" onclick="start()">开始领取</button>
  <div class="foot">若没自动跳转，请手动点开汽水音乐</div>

</div>

<script>
  var MIN = 1, MAX = 60;
  var target = 10;
  var busy = false;

  try {
    var saved = localStorage.getItem('qishui_target');
    if (saved) {
      var n = parseInt(saved, 10);
      if (!isNaN(n) && n >= MIN && n <= MAX) target = n;
    }
  } catch (e) {}

  function refresh() {
    document.getElementById('num').textContent = target;
    document.getElementById('minus').className = 'step' + (target <= MIN ? ' off' : '');
    document.getElementById('plus').className = 'step' + (target >= MAX ? ' off' : '');
    var chips = document.querySelectorAll('.chip');
    for (var i = 0; i < chips.length; i++) {
      var v = parseInt(chips[i].getAttribute('data-v'), 10);
      chips[i].className = 'chip' + (v === target ? ' on' : '');
    }
  }

  function setTarget(n) {
    target = Math.max(MIN, Math.min(MAX, n));
    refresh();
  }

  function step(d) {
    if (busy) return;
    setTarget(target + d);
  }

  function start() {
    if (busy) return;
    busy = true;
    var btn = document.getElementById('go');
    btn.textContent = '启动中…';
    btn.className = 'go busy';
    try { localStorage.setItem('qishui_target', String(target)); } catch (e) {}
    if (window.airscript && window.airscript.call) {
      window.airscript.call('start', String(target));
    }
  }

  function cancel() {
    if (window.airscript && window.airscript.call) {
      window.airscript.call('cancel', '1');
    }
  }

  // 绑定快捷值
  var chipNodes = document.querySelectorAll('.chip');
  for (var i = 0; i < chipNodes.length; i++) {
    (function (el) {
      el.onclick = function () {
        if (busy) return;
        setTarget(parseInt(el.getAttribute('data-v'), 10));
      };
    })(chipNodes[i]);
  }

  refresh();
</script>
</body>
</html>
